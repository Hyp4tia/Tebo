# project.yml — generates Tebo.xcodeproj via `xcodegen generate`
# Why: Swift Packages can't Cmd+R as a real .app (no bundle ID → linkd errors).
# A real Xcode project gives you Cmd+R = build Tebo.app + launch window.
# Usage: xcodegen generate  →  open Tebo.xcodeproj

name: Tebo
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
options:
  bundleIdPrefix: com.tebo
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "6.0"
  SWIFT_STRICT_CONCURRENCY: complete
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  # Ad-hoc by default so a command line build works with no Apple team configured.
  # scripts/release.sh overrides this with the Developer ID identity.
  CODE_SIGN_STYLE: Manual
  CODE_SIGN_IDENTITY: "-"
  DEVELOPMENT_TEAM: ""
  ENABLE_HARDENED_RUNTIME: YES
  MARKETING_VERSION: "1.3"
  CURRENT_PROJECT_VERSION: "4"

targets:
  Tebo:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Sources/Tebo
      - path: Resources/Tebo.icns
        buildPhase: resources
      - path: Resources/TeboLogo.png
        buildPhase: resources
      - path: Resources/TeboBackdrop.png
        buildPhase: resources
      - path: Resources/NOTICE.md
        buildPhase: resources
      - path: Resources/whitelist.default
        buildPhase: resources
      # Info.plist and entitlements are wired through build settings only. Deliberately NOT using
      # xcodegen's `info:`/`entitlements:` keys: those GENERATE the file at that path, which silently
      # overwrote hand-written keys (icon, category, copyright) once already.
      - path: Resources/Info.plist
        buildPhase: none
      - path: Resources/Tebo.entitlements
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: Tebo
        PRODUCT_BUNDLE_IDENTIFIER: com.tebo.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Tebo.entitlements
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Resources/Tebo.Debug.entitlements
    postBuildScripts:
      - name: Bundle portable video helpers when available
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          python3 "$SRCROOT/scripts/bundle-video-helpers.py" "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME" --identity "${EXPANDED_CODE_SIGN_IDENTITY_NAME:--}"
      # The czkawka engine ships next to the app executable and is signed with the same identity:
      # a hardened-runtime app cannot launch an unsigned nested binary.
      - name: Bundle + sign the czkawka engine
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          ENGINE_SRC="$SRCROOT/Engines/czkawka_cli"
          DEST_DIR="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/MacOS"
          if [ ! -f "$ENGINE_SRC" ]; then
            echo "warning: Engines/czkawka_cli is missing — run scripts/fetch-engine.sh (the app will report the engine as not installed)"
            exit 0
          fi
          mkdir -p "$DEST_DIR"
          cp -f "$ENGINE_SRC" "$DEST_DIR/czkawka_cli"
          chmod 755 "$DEST_DIR/czkawka_cli"
          SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY_NAME:--}"
          TIMESTAMP="--timestamp=none"
          case "$SIGN_IDENTITY" in
            "Developer ID Application"*) TIMESTAMP="--timestamp" ;;
          esac
          /usr/bin/codesign --force --options runtime "$TIMESTAMP" \
            --sign "$SIGN_IDENTITY" "$DEST_DIR/czkawka_cli"
          echo "bundled czkawka_cli signed as $SIGN_IDENTITY"

  TeboTests:
    type: bundle.unit-test
    platform: macOS
    bundleId: com.tebo.app.tests
    sources:
      - path: Tests/TeboTests
    dependencies:
      - target: Tebo
